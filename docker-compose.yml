services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: storybot
      POSTGRES_PASSWORD: storybotpass
      POSTGRES_DB: storybotdb
    ports:
      - '5432:5432'
    volumes:
      - ./database/migrations:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - '5672:5672'   # AMQP protocol port
      - '15672:15672' # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

  ai-pipeline:
    build: python-services/ai-pipeline
    env_file:
      - python-services/ai-pipeline/.env
    volumes:
      - generated_videos:/app/videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '8001:8001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  content-manager:
    build: go-services/content-manager
    env_file:
      - go-services/content-manager/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - '9001:9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_STORY_COLLECTOR_URL: http://localhost:8001
        NEXT_PUBLIC_VIDEO_GENERATOR_URL: http://localhost:8001
        NEXT_PUBLIC_CONTENT_MANAGER_URL: http://localhost:9001
        NEXT_PUBLIC_SOCIAL_MEDIA_BOT_URL: http://localhost:9001
        NEXT_PUBLIC_ADMIN_USER: admin
        NEXT_PUBLIC_ADMIN_PASS: password
    ports:
      - '3000:3000'
    depends_on:
      ai-pipeline:
        condition: service_healthy
      content-manager:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  generated_videos:
